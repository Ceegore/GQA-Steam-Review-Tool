[mypy]
# Strict-mode type checking for the steam_review_tool package.
#
# Run with:  python -m mypy steam_review_tool
#
# The third-party deps (customtkinter, requests, playwright) have no
# type stubs in this environment, so we silence missing-import
# for them. Legacy helpers that haven't been annotated yet are
# gradually tightened; per-module ``[mypy-<name>]`` blocks below
# document the rationale for each exclusion.
#
# NB: ``strict = True`` is NOT used here because it implicitly turns
# on ``check_untyped_defs`` and ``disallow_untyped_defs`` which we
# keep off during the gradual-annotation phase. The remaining strict
# options are listed explicitly below.

python_version = 3.12
warn_unused_ignores = True
# ``warn_return_any`` is off because several helpers return ``dict``
# / ``list`` literals parsed from JSON which are intrinsically Any-typed.
warn_return_any = False
no_implicit_optional = True
disallow_any_explicit = False
# Legacy helpers are still being annotated; turning these off
# lets us add file-level annotations incrementally without breaking
# the build on every commit.
check_untyped_defs = False
disallow_untyped_defs = False
disallow_untyped_decorators = False
disallow_incomplete_defs = False
warn_redundant_casts = True
no_implicit_reexport = False

# Per-module overrides ------------------------------------------------

[mypy-customtkinter]
ignore_missing_imports = True
ignore_errors = True

[mypy-requests]
ignore_missing_imports = True

[mypy-playwright]
ignore_missing_imports = True
ignore_errors = True

[mypy-playwright.*]
ignore_missing_imports = True
ignore_errors = True

# Exclude generated / build artefacts.
exclude = (?x) (^build/ | ^dist/ | \.venv/ | ^steam_review_tool\.legacy\.py\.bak | ^steam_review_tool\.py$ | ^tests/)

show_error_codes = True